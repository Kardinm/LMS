{% extends 'base.html' %}

{% block title %}Видалити урок{% endblock %}

{% block content %}
<h1>Видалити урок</h1>
<p>Ви впевнені, що хочете видалити урок "<strong>{{ object.title }}</strong>" з модуля "{{ object.module.title }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Так, видалити</button>
    <a href="{{ object.get_absolute_url }}">Скасувати</a>
</form>
{% endblock %}
