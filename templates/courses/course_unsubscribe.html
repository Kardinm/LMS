{% extends 'base.html' %}

{% block title %}Відписка від курсу{% endblock %}

{% block content %}
<div class="form-box">
    <div class="card" style="text-align:center;">
        <h1>Відписка від курсу</h1>
        <p>Ви впевнені, що хочете відписатися від курсу<br><strong>"{{ course.title }}"</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Так, відписатися</button>
            <a href="{{ course.get_absolute_url }}" class="btn btn-secondary">Скасувати</a>
        </form>
    </div>
</div>
{% endblock %}
