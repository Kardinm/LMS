{% extends 'base.html' %}

{% block title %}Відписка від курсу{% endblock %}

{% block content %}
<h1>Відписка від курсу</h1>
<p>Ви впевнені, що хочете відписатися від курсу "<strong>{{ course.title }}</strong>"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Так, відписатися</button>
    <a href="{{ course.get_absolute_url }}">Скасувати</a>
</form>
{% endblock %}
