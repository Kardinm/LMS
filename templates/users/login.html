{% extends 'base.html' %}

{% block title %}Вхід{% endblock %}

{% block content %}
<div class="form-box">
    <div class="card">
        <h1 style="text-align:center;">Вхід</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary" style="width:100%;">Увійти</button>
        </form>

        <p style="text-align:center; margin-top: 16px;">
            Ще не маєте акаунта? <a href="{% url 'register' %}">Зареєструватися</a>
        </p>
    </div>
</div>
{% endblock %}
